<div class="form-container">
  <h2>Solicitar Préstamo de Libro</h2>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>ID del Libro:</label>
      <input type="number" [(ngModel)]="loan.bookId" name="bookId" min="1" required />
    </div>

    <div class="form-group">
      <label>ID del Socio:</label>
      <input type="number" [(ngModel)]="loan.memberId" name="memberId" min="1" required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-success">Registrar Préstamo</button>
      <a routerLink="/books" class="btn btn-cancel">Volver al Catálogo</a>
    </div>
  </form>
</div>
