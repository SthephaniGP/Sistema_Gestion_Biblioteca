<div class="form-container">
  <h2>Registrar Nuevo Libro</h2>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>ISBN:</label>
      <input type="text" [(ngModel)]="book.isbn" name="isbn" required />
    </div>

    <div class="form-group">
      <label>Título:</label>
      <input type="text" [(ngModel)]="book.title" name="title" required />
    </div>

    <div class="form-group">
      <label>ID del Autor:</label>
      <input type="number" [(ngModel)]="book.authorId" name="authorId" min="1" required />
    </div>

    <div class="form-group">
      <label>Total de Copias:</label>
      <input type="number" [(ngModel)]="book.totalCopies" name="totalCopies" min="1" required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Guardar Libro</button>
      <a routerLink="/books" class="btn btn-cancel">Cancelar</a>
    </div>
  </form>
</div>
